<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ava - ApX Virtual Assistant</title>
  <style>
    :root {
      --bg: #0a0b13;
      --panel: #121426;
      --ink: #e7e7ff;
      --cyan: #35f0ff;
      --mag: #ff38d6;
      --muted: #9aa0b3;
      --user-bg: #1a1d2e;
      --ava-bg: #0f1222;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--ink);
      display: flex;
    }

    /* Sidebar */
    #sidebar {
      width: 260px;
      background: var(--panel);
      border-right: 1px solid rgba(255,255,255,0.06);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }
    #sidebar-header {
      padding: 16px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    #sidebar-header h2 {
      font-size: 14px;
      color: var(--muted);
      margin-bottom: 12px;
    }
    #new-session {
      width: 100%;
      padding: 10px 16px;
      border: 1px dashed rgba(255,255,255,0.2);
      border-radius: 8px;
      background: transparent;
      color: var(--ink);
      cursor: pointer;
      font-size: 14px;
      transition: all 0.2s;
    }
    #new-session:hover {
      border-color: var(--cyan);
      color: var(--cyan);
    }
    #session-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }
    .session-item {
      padding: 12px;
      border-radius: 8px;
      cursor: pointer;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: all 0.2s;
    }
    .session-item:hover {
      background: rgba(255,255,255,0.05);
    }
    .session-item.active {
      background: rgba(53,240,255,0.1);
      border: 1px solid rgba(53,240,255,0.2);
    }
    .session-info {
      flex: 1;
      min-width: 0;
    }
    .session-name {
      font-size: 14px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .session-date {
      font-size: 11px;
      color: var(--muted);
      margin-top: 2px;
    }
    .session-delete {
      opacity: 0;
      background: none;
      border: none;
      color: #ff5d73;
      cursor: pointer;
      padding: 4px 8px;
      font-size: 16px;
      transition: opacity 0.2s;
    }
    .session-item:hover .session-delete {
      opacity: 1;
    }

    /* Main chat area */
    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }
    header {
      padding: 16px 20px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      background: var(--panel);
      display: flex;
      align-items: center;
      gap: 12px;
    }
    #menu-toggle {
      display: none;
      background: none;
      border: none;
      color: var(--ink);
      font-size: 24px;
      cursor: pointer;
      padding: 4px;
    }
    header h1 {
      font-size: 20px;
      font-weight: 700;
    }
    header h1 span { color: var(--cyan); }
    #session-title {
      color: var(--muted);
      font-size: 14px;
      font-weight: normal;
      margin-left: 8px;
    }
    .header-buttons {
      margin-left: auto;
      display: flex;
      gap: 8px;
      align-items: center;
    }
    #status {
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 12px;
      background: #1a3a1a;
      color: #4ade80;
    }
    #status.offline {
      background: #3a1a1a;
      color: #f87171;
    }
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .msg {
      max-width: 85%;
      padding: 12px 16px;
      border-radius: 16px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    .msg.user {
      align-self: flex-end;
      background: var(--user-bg);
      border: 1px solid rgba(53,240,255,0.2);
    }
    .msg.ava {
      align-self: flex-start;
      background: var(--ava-bg);
      border: 1px solid rgba(255,56,214,0.2);
    }
    .msg.ava .label {
      font-size: 11px;
      color: var(--mag);
      margin-bottom: 6px;
      font-weight: 600;
    }
    .msg code {
      background: rgba(0,0,0,0.3);
      padding: 2px 6px;
      border-radius: 4px;
      font-family: monospace;
    }
    .msg pre {
      background: rgba(0,0,0,0.4);
      padding: 12px;
      border-radius: 8px;
      overflow-x: auto;
      margin: 8px 0;
      font-family: monospace;
      font-size: 14px;
    }
    #input-area {
      padding: 16px 20px;
      border-top: 1px solid rgba(255,255,255,0.06);
      background: var(--panel);
      display: flex;
      gap: 12px;
    }
    #input {
      flex: 1;
      padding: 12px 16px;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      background: var(--bg);
      color: var(--ink);
      font-size: 16px;
      outline: none;
      resize: none;
      min-height: 48px;
      max-height: 150px;
    }
    #input:focus {
      border-color: var(--cyan);
      box-shadow: 0 0 0 2px rgba(53,240,255,0.1);
    }
    #send {
      padding: 12px 24px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--cyan), var(--mag));
      color: #000;
      font-weight: 600;
      font-size: 16px;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    #send:hover { opacity: 0.9; }
    #send:disabled { opacity: 0.5; cursor: not-allowed; }
    .typing { color: var(--muted); font-style: italic; }
    .timestamp {
      font-size: 10px;
      color: var(--muted);
      margin-top: 4px;
    }

    /* Mobile */
    @media (max-width: 768px) {
      #sidebar {
        position: fixed;
        left: -280px;
        top: 0;
        bottom: 0;
        z-index: 100;
        transition: left 0.3s;
      }
      #sidebar.open { left: 0; }
      #menu-toggle { display: block; }
      .msg { max-width: 95%; }
      #send { padding: 12px 16px; }
      #overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.5);
        z-index: 99;
      }
      #overlay.open { display: block; }
    }
  </style>
</head>
<body>
  <div id="overlay" onclick="toggleSidebar()"></div>

  <aside id="sidebar">
    <div id="sidebar-header">
      <h2>Sessions</h2>
      <button id="new-session" onclick="newSession()">+ New Session</button>
    </div>
    <div id="session-list"></div>
  </aside>

  <div id="main">
    <header>
      <button id="menu-toggle" onclick="toggleSidebar()">☰</button>
      <h1><span>Ava</span><span id="session-title"></span></h1>
      <div class="header-buttons">
        <div id="status">Connecting...</div>
      </div>
    </header>

    <div id="chat"></div>

    <div id="input-area">
      <textarea id="input" placeholder="Ask Ava about ApX..." rows="1"></textarea>
      <button id="send">Send</button>
    </div>
  </div>

  <script>
    const OLLAMA_URL = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
      ? 'http://localhost:11434'
      : `http://${window.location.hostname}:11434`;

    const SESSIONS_KEY = 'ava_sessions';
    const CURRENT_KEY = 'ava_current_session';

    const chat = document.getElementById('chat');
    const input = document.getElementById('input');
    const sendBtn = document.getElementById('send');
    const status = document.getElementById('status');
    const sessionList = document.getElementById('session-list');
    const sessionTitle = document.getElementById('session-title');
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('overlay');

    let currentSessionId = null;

    // Initialize
    init();

    function init() {
      const sessions = getSessions();
      if (Object.keys(sessions).length === 0) {
        newSession();
      } else {
        const lastId = localStorage.getItem(CURRENT_KEY) || Object.keys(sessions)[0];
        loadSession(lastId);
      }
      renderSessionList();
      checkConnection();
      setInterval(checkConnection, 30000);
    }

    function getSessions() {
      try {
        return JSON.parse(localStorage.getItem(SESSIONS_KEY)) || {};
      } catch {
        return {};
      }
    }

    function saveSessions(sessions) {
      localStorage.setItem(SESSIONS_KEY, JSON.stringify(sessions));
    }

    function newSession() {
      const id = 'session_' + Date.now();
      const sessions = getSessions();
      sessions[id] = {
        id,
        name: 'New Chat',
        created: new Date().toISOString(),
        messages: []
      };
      saveSessions(sessions);
      loadSession(id);
      renderSessionList();
      // Auto-name after first message
    }

    function loadSession(id) {
      const sessions = getSessions();
      if (!sessions[id]) {
        newSession();
        return;
      }
      currentSessionId = id;
      localStorage.setItem(CURRENT_KEY, id);

      const session = sessions[id];
      sessionTitle.textContent = session.name !== 'New Chat' ? ` - ${session.name}` : '';

      chat.innerHTML = '';
      if (session.messages.length === 0) {
        addMessage("Hi! I'm Ava, your ApX Virtual Assistant. Ask me anything about ApX!", 'ava', null, false);
      } else {
        session.messages.forEach(msg => {
          addMessage(msg.text, msg.sender, msg.time, false);
        });
      }
      chat.scrollTop = chat.scrollHeight;
      renderSessionList();

      // Close sidebar on mobile
      sidebar.classList.remove('open');
      overlay.classList.remove('open');
    }

    function deleteSession(id, e) {
      e.stopPropagation();
      if (!confirm('Delete this session?')) return;

      const sessions = getSessions();
      delete sessions[id];
      saveSessions(sessions);

      if (id === currentSessionId) {
        const remaining = Object.keys(sessions);
        if (remaining.length > 0) {
          loadSession(remaining[0]);
        } else {
          newSession();
        }
      }
      renderSessionList();
    }

    function renderSessionList() {
      const sessions = getSessions();
      const sorted = Object.values(sessions).sort((a, b) =>
        new Date(b.created) - new Date(a.created)
      );

      sessionList.innerHTML = sorted.map(s => `
        <div class="session-item ${s.id === currentSessionId ? 'active' : ''}"
             onclick="loadSession('${s.id}')">
          <div class="session-info">
            <div class="session-name">${escapeHtml(s.name)}</div>
            <div class="session-date">${formatDate(s.created)}</div>
          </div>
          <button class="session-delete" onclick="deleteSession('${s.id}', event)">×</button>
        </div>
      `).join('');
    }

    function formatDate(iso) {
      const d = new Date(iso);
      const now = new Date();
      if (d.toDateString() === now.toDateString()) {
        return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      }
      return d.toLocaleDateString([], { month: 'short', day: 'numeric' });
    }

    function toggleSidebar() {
      sidebar.classList.toggle('open');
      overlay.classList.toggle('open');
    }

    async function checkConnection() {
      try {
        const res = await fetch(`${OLLAMA_URL}/api/tags`);
        if (res.ok) {
          status.textContent = 'Online';
          status.classList.remove('offline');
        }
      } catch {
        status.textContent = 'Offline';
        status.classList.add('offline');
      }
    }

    input.addEventListener('input', () => {
      input.style.height = 'auto';
      input.style.height = Math.min(input.scrollHeight, 150) + 'px';
    });

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    sendBtn.addEventListener('click', sendMessage);

    async function sendMessage() {
      const text = input.value.trim();
      if (!text || !currentSessionId) return;

      const time = new Date().toLocaleTimeString();
      addMessage(text, 'user', time, true);

      // Auto-name session from first user message
      const sessions = getSessions();
      if (sessions[currentSessionId].name === 'New Chat') {
        sessions[currentSessionId].name = text.slice(0, 30) + (text.length > 30 ? '...' : '');
        saveSessions(sessions);
        sessionTitle.textContent = ` - ${sessions[currentSessionId].name}`;
        renderSessionList();
      }

      input.value = '';
      input.style.height = 'auto';
      sendBtn.disabled = true;

      const typingEl = document.createElement('div');
      typingEl.className = 'msg ava typing';
      typingEl.innerHTML = '<div class="label">Ava</div>Thinking...';
      chat.appendChild(typingEl);
      chat.scrollTop = chat.scrollHeight;

      try {
        const res = await fetch(`${OLLAMA_URL}/api/generate`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ model: 'ava', prompt: text, stream: false })
        });
        const data = await res.json();
        typingEl.remove();
        addMessage(data.response, 'ava', new Date().toLocaleTimeString(), true);
      } catch {
        typingEl.remove();
        addMessage('Error: Could not connect to Ava.', 'ava', null, false);
      }

      sendBtn.disabled = false;
      input.focus();
    }

    function addMessage(text, sender, time, save = true) {
      const msg = document.createElement('div');
      msg.className = `msg ${sender}`;
      const timeStr = time ? `<div class="timestamp">${time}</div>` : '';

      if (sender === 'ava') {
        msg.innerHTML = '<div class="label">Ava</div>' + formatResponse(text) + timeStr;
      } else {
        msg.innerHTML = escapeHtml(text) + timeStr;
      }

      chat.appendChild(msg);
      chat.scrollTop = chat.scrollHeight;

      if (save && currentSessionId) {
        const sessions = getSessions();
        sessions[currentSessionId].messages.push({ text, sender, time });
        if (sessions[currentSessionId].messages.length > 100) {
          sessions[currentSessionId].messages.shift();
        }
        saveSessions(sessions);
      }
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function formatResponse(text) {
      let html = escapeHtml(text);
      html = html.replace(/```(\w*)\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>');
      html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
      html = html.replace(/\n/g, '<br>');
      return html;
    }
  </script>
</body>
</html>
